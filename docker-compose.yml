services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: ats-postgres
    restart: always
    environment:
      POSTGRES_DB: ats_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ats_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ats-network

  # 2. Python AI Microservice
  python-ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: ats-python-ai
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ats-network

  # 3. Java Backend Service
  spring-boot-backend:
    build:
      context: ./java-backend-service
      dockerfile: Dockerfile
    container_name: ats-spring-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      python-ai-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ats_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AI_SERVICE_URL: http://python-ai-service:8000
      SPRING_MAIL_USERNAME: notification.personal.mail@gmail.com
      SPRING_MAIL_PASSWORD: jppw nxhy flaf swcl
      ATS_NOTIFICATION_TARGET_EMAIL: notification.personal.mail@gmail.com
    networks:
      - ats-network

volumes:
  postgres_data:

networks:
  ats-network:
    driver: bridge