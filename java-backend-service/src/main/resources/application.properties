spring.application.name=java-backend-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres-db:5432/ats_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Constraints
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Python AI Service URL (points to Docker service name)
python.ai.service.url=http://python-ai-service:8000