# ===================================================================
# Application & Server Configuration
# ===================================================================
spring.application.name=ats-resume-service
server.port=${PORT:8080}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# Database Configuration (PostgreSQL & HikariCP Pool)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ats_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate & SQL Initialization
# Forces Hibernate DDL creation FIRST before executing data.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Script Initialization Configuration
# Prevents application crash if data already exists or SQL fails
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.data-locations=classpath:data.sql

# ===================================================================
# File Upload Limits
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
ats.pdf.max-file-size-mb=10

# ===================================================================
# External Services (Python AI Microservice & Custom Configs)
# ===================================================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ats.notification.target-email=${ATS_NOTIFICATION_TARGET_EMAIL:notification.personal.mail@gmail.com}

# ===================================================================
# Spring Mail Configuration (Gmail SMTP)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:notification.personal.mail@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# Error Handling & Logging
# ===================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.ats=${LOGGING_LEVEL_COM_ATS:DEBUG}
logging.level.org.apache.pdfbox=WARN