<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Resume Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8">
    <h1 class="text-3xl font-bold text-center text-indigo-400 mb-2">ATS Resume Matcher</h1>
    <p class="text-center text-slate-400 mb-8 text-sm">Upload your resume and match it against a job description in real time.</p>

    <form id="matchForm" class="space-y-6">
      
      <!-- Resume Upload -->
      <div>
        <label class="block text-sm font-medium mb-2 text-slate-300">Resume PDF</label>
        <div class="flex items-center justify-center w-full">
          <label id="dropZone" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-600 rounded-xl cursor-pointer bg-slate-800/50 hover:bg-slate-700/50 hover:border-indigo-500 transition">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg class="w-8 h-8 mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              <p class="text-xs text-slate-400" id="fileName">Click or drag & drop PDF resume here</p>
            </div>
            <input type="file" id="resumeInput" accept=".pdf" class="hidden" required />
          </label>
        </div>
      </div>

<!-- Job Description -->
<div>
  <label for="jobDescription" class="block text-sm font-medium mb-2 text-slate-300">
    Job Description
  </label>
  <textarea 
    id="jobDescription" 
    name="job_text" 
    rows="4" 
    placeholder="Please provide the job description text" 
    onfocus="this.placeholder=''" 
    onblur="this.placeholder='Please provide the job description text'" 
    required
    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm placeholder-slate-500"></textarea>
</div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
        <span>Analyze Match</span>
      </button>
    </form>

    <!-- Error Alert -->
    <div id="errorBox" class="hidden mt-6 bg-red-900/40 border border-red-500/50 text-red-200 text-sm p-4 rounded-xl"></div>

    <!-- Results Section -->
    <div id="resultsCard" class="hidden mt-8 border-t border-slate-700 pt-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-100">Match Results</h2>
        <span id="resultId" class="text-xs font-mono text-slate-400 bg-slate-700 px-2.5 py-1 rounded-md"></span>
      </div>

      <!-- Match Score Progress -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-medium text-slate-300">Match Score</span>
          <span id="scoreText" class="text-lg font-bold text-indigo-400">0%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
          <div id="scoreBar" class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Missing Keywords -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
        <h3 class="text-sm font-medium text-slate-300 mb-2">Missing Keywords</h3>
        <div id="missingKeywordsList" class="flex flex-wrap gap-2 text-xs">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById('matchForm');
    const resumeInput = document.getElementById('resumeInput');
    const fileNameDisplay = document.getElementById('fileName');
    const dropZone = document.getElementById('dropZone');
    const submitBtn = document.getElementById('submitBtn');
    const resultsCard = document.getElementById('resultsCard');
    const errorBox = document.getElementById('errorBox');

    // Display selected filename
    resumeInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameDisplay.textContent = file.name;
        fileNameDisplay.classList.add('text-indigo-400', 'font-medium');
      }
    });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const file = resumeInput.files[0];
      const jobDesc = document.getElementById('jobDescription').value.trim();

      if (!file) {
        showError('Please select a PDF resume file.');
        return;
      }

      // Clear state & show loading
      errorBox.classList.add('hidden');
      resultsCard.classList.add('hidden');
      setLoading(true);

      const formData = new FormData();
      formData.append('resume', file);
      formData.append('jobDescription', jobDesc);

      try {
        const response = await fetch('http://localhost:8080/api/v1/resume/match', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const data = await response.json();
        displayResults(data);

      } catch (err) {
        showError(`Failed to connect to backend: ${err.message}`);
      } finally {
        setLoading(false);
      }
    });

    function displayResults(data) {
      document.getElementById('resultId').textContent = `Record ID: #${data.id}`;
      
      const score = data.match_score !== null ? data.match_score : 0;
      document.getElementById('scoreText').textContent = `${score}%`;
      document.getElementById('scoreBar').style.width = `${score}%`;

      const missingBox = document.getElementById('missingKeywordsList');
      missingBox.innerHTML = '';

      if (data.missing_keywords && data.missing_keywords.trim() !== '') {
        const keywords = data.missing_keywords.split(',').map(s => s.trim()).filter(Boolean);
        keywords.forEach(kw => {
          const badge = document.createElement('span');
          badge.className = 'bg-red-900/50 border border-red-500/50 text-red-300 px-2.5 py-1 rounded-md';
          badge.textContent = kw;
          missingBox.appendChild(badge);
        });
      } else {
        missingBox.innerHTML = '<span class="text-emerald-400">All required keywords found!</span>';
      }

      resultsCard.classList.remove('hidden');
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Processing...</span>`;
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Analyze Match</span>`;
      }
    }
  </script>
  <!-- Resume Rephraser Section -->
<div class="mt-8 border-t border-slate-700 pt-6">
  <h2 class="text-xl font-bold text-slate-100 mb-4">AI Resume Rephraser</h2>
  
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-2 text-slate-300">Skills to Add/Highlight</label>
      <input type="text" id="userSkillsInput" placeholder="e.g. Java, Spring Boot, Microservices, Kubernetes, System Design" 
        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>

    <button type="button" id="rephraseBtn" onclick="handleRephrase()"
      class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
      <span>Rephrase & Tailor Resume</span>
    </button>
  </div>

  <!-- Rephrased Output Box -->
  <div id="rephrasedOutputBox" class="hidden mt-6 bg-slate-900 border border-slate-700 rounded-xl p-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-sm font-semibold text-emerald-400">Optimized Resume Draft</h3>
      <button onclick="navigator.clipboard.writeText(document.getElementById('rephrasedContent').innerText)" 
        class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600">
        Copy Draft
      </button>
    </div>
    <div id="rephrasedContent" class="text-xs text-slate-300 whitespace-pre-wrap font-mono leading-relaxed max-h-96 overflow-y-auto"></div>
  </div>
</div>

<script>
  async function handleRephrase() {
    const file = document.getElementById('resumeInput').files[0];
    const skills = document.getElementById('userSkillsInput').value.trim();
    const btn = document.getElementById('rephraseBtn');
    const outputBox = document.getElementById('rephrasedOutputBox');
    const contentBox = document.getElementById('rephrasedContent');

    if (!file) {
      alert("Please upload a PDF resume first.");
      return;
    }
    if (!skills) {
      alert("Please enter skills to incorporate.");
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span>AI is generating draft...</span>`;

    const formData = new FormData();
    formData.append('resume', file);
    formData.append('userSkills', skills);

    try {
      const response = await fetch('http://localhost:8080/api/v1/resume/rephrase', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      contentBox.innerText = data.rephrased_resume;
      outputBox.classList.remove('hidden');

    } catch (err) {
      alert("Error generating rephrased resume: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span>Rephrase & Tailor Resume</span>`;
    }
  }
</script>
</body>
</html>
